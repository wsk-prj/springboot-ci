name: CI - Build and Test Development

on:
  pull_request:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build and test
      run: ./gradlew build
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Notify on Success (Discord)
      if: success()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "✅ CI Pipeline Success",
              "description": "All checks passed successfully!",
              "color": 65280,
              "fields": [
                {"name": "📋 Pull Request", "value": "[#${{ github.event.number }}: ${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})", "inline": false},
                {"name": "🌿 Branch", "value": "`${{ github.head_ref }}`", "inline": true},
                {"name": "👤 Author", "value": "${{ github.event.pull_request.user.login }}", "inline": true},
                {"name": "⏱️ Duration", "value": "<t:${{ github.run_number }}:R>", "inline": true},
                {"name": "🔗 Workflow Run", "value": "[View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
              ],
              "footer": {
                "text": "GitHub Actions • ${{ github.repository }}",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }'
        
    - name: Notify on Failure (Discord)
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "❌ CI Pipeline Failed",
              "description": "One or more checks have failed!",
              "color": 16711680,
              "fields": [
                {"name": "📋 Pull Request", "value": "[#${{ github.event.number }}: ${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})", "inline": false},
                {"name": "🌿 Branch", "value": "`${{ github.head_ref }}`", "inline": true},
                {"name": "👤 Author", "value": "${{ github.event.pull_request.user.login }}", "inline": true},
                {"name": "⏱️ Duration", "value": "<t:${{ github.run_number }}:R>", "inline": true},
                {"name": "🔗 Workflow Run", "value": "[View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
              ],
              "footer": {
                "text": "GitHub Actions • ${{ github.repository }}",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }'
