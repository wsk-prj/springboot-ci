name: CD - Deploy Development

on:
  pull_request:
    types: [closed]
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: [self-hosted, oci, dev]
    if: github.event.pull_request.merged == true
    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Pull Docker image
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Stop existing container
      run: |
        docker stop springboot-app || true
        docker rm springboot-app || true

    - name: Start new container
      run: |
        docker run -d \
          --name springboot-app \
          --restart unless-stopped \
          -p 8080:8080 \
          -e SPRING_PROFILES_ACTIVE=dev \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Verify deployment
      run: |
        sleep 10
        if docker ps | grep -q springboot-app; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
          docker logs springboot-app
          exit 1
        fi
        
    - name: Notify on Success (Discord)
      if: success()
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        PR_TITLE=$(echo "${{ github.event.pull_request.title }}" | sed 's/"/\\"/g' | sed 's/\\/\\\\/g')
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL_CD }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "Deployment Success!",
              "description": "> Current HEAD is [#'$SHORT_SHA'](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) (`${{ github.base_ref }}`)",
              "color": 65280,
              "fields": [
                {"name": "🔗 Detail", "value": "[[PR #${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})] ${{ github.event.pull_request.title }}", "inline": false}
              ]
            }]
          }'
        
    - name: Notify on Failure (Discord)
      if: failure()
      run: |
        curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL_CD }}" \
          -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "Deployment Failed",
              "color": 16711680,
              "content": "@everyone",
              "fields": [
                {"name": "🔗 Detail", "value": "[[PR #${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})] ${{ github.event.pull_request.title }}\n[Action #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
              ]
            }]
          }'
